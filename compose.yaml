name: industrial-intelligence-platform

x-common-env: &common-env
  IIP_PROFILE: ${IIP_PROFILE:-small}
  IIP_SEED: ${IIP_SEED:-20261019}
  IIP_DATA_DIR: /opt/iip/data
  POSTGRES_DSN: postgresql://industrial:${POSTGRES_PASSWORD:-change-me}@postgres:5432/industrial
  MONGO_URI: mongodb://industrial:${MONGO_PASSWORD:-change-me}@mongodb:27017/industrial?authSource=admin
  MONGO_DATABASE: industrial
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change-me-neo4j}

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: industrial
      POSTGRES_USER: industrial
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports: ["${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U industrial -d industrial"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  mongodb:
    image: mongo:7.0.14-jammy
    environment:
      MONGO_INITDB_ROOT_USERNAME: industrial
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-change-me}
      MONGO_INITDB_DATABASE: industrial
    ports: ["${MONGO_HOST_PORT:-27017}:27017"]
    volumes:
      - mongo-data:/data/db
      - ./scripts/init-mongo.js:/docker-entrypoint-initdb.d/10-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "industrial", "--password", "${MONGO_PASSWORD:-change-me}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  neo4j:
    image: neo4j:5.23.0-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-me-neo4j}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports: ["${NEO4J_HTTP_HOST_PORT:-7474}:7474", "${NEO4J_BOLT_HOST_PORT:-7687}:7687"]
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p '${NEO4J_PASSWORD:-change-me-neo4j}' 'RETURN 1' >/dev/null"]
      interval: 15s
      timeout: 8s
      retries: 15
    restart: unless-stopped

  spark-master:
    image: apache/spark:3.5.3
    command: ["/opt/spark/sbin/start-master.sh"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
    ports: ["7077:7077", "8081:8080"]
    volumes:
      - ./data:/opt/iip/data
      - ./reports:/opt/iip/reports
      - ./models:/opt/iip/models
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080'"]
      interval: 15s
      timeout: 5s
      retries: 12

  spark-worker:
    image: apache/spark:3.5.3
    command: ["/opt/spark/sbin/start-worker.sh", "spark://spark-master:7077"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_CORES: 2
    depends_on:
      spark-master:
        condition: service_healthy
    ports: ["8082:8081"]
    volumes:
      - ./data:/opt/iip/data
      - ./reports:/opt/iip/reports
      - ./models:/opt/iip/models

  spark-submit:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    entrypoint: ["/opt/spark/bin/spark-submit", "--master", "spark://spark-master:7077", "--py-files", "/opt/iip/src", "/opt/iip/src/industrial_intelligence/spark_jobs/transform.py", "--data-dir", "/opt/iip/data"]
    environment: *common-env
    volumes:
      - ./data:/opt/iip/data
      - ./reports:/opt/iip/reports
      - ./models:/opt/iip/models
    depends_on:
      spark-master:
        condition: service_healthy
    profiles: ["jobs"]

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    environment: *common-env
    command: ["uvicorn", "industrial_intelligence.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["${APP_HOST_PORT:-8000}:8000"]
    volumes:
      - ./data:/opt/iip/data
      - ./reports:/opt/iip/reports
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    depends_on:
      postgres: { condition: service_healthy }
      mongodb: { condition: service_healthy }
      neo4j: { condition: service_healthy }
    restart: unless-stopped

  airflow-init:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    environment: &airflow-env
      <<: *common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://industrial:${POSTGRES_PASSWORD:-change-me}@postgres:5432/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-change-me-secret-key}
    command:
      - bash
      - -ec
      - |
        airflow db migrate
        airflow users create --username ${AIRFLOW_ADMIN_USER:-admin} --password ${AIRFLOW_ADMIN_PASSWORD:-change-me-airflow} --firstname Industrial --lastname Admin --role Admin --email admin@example.invalid || true
    volumes: &airflow-volumes
      - ./dags:/opt/airflow/dags:ro
      - ./data:/opt/iip/data
      - ./reports:/opt/iip/reports
      - ./models:/opt/iip/models
      - airflow-logs:/opt/airflow/logs
    depends_on:
      postgres: { condition: service_healthy }

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    environment: *airflow-env
    command: webserver
    ports: ["${AIRFLOW_HOST_PORT:-8080}:8080"]
    volumes: *airflow-volumes
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 8s
      retries: 15
    depends_on:
      airflow-init: { condition: service_completed_successfully }
    restart: unless-stopped

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    environment: *airflow-env
    command: scheduler
    volumes: *airflow-volumes
    depends_on:
      airflow-init: { condition: service_completed_successfully }
      spark-master: { condition: service_healthy }
    restart: unless-stopped

volumes:
  postgres-data:
  mongo-data:
  neo4j-data:
  airflow-logs:
