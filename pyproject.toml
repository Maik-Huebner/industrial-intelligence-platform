[build-system]
requires = ["hatchling==1.25.0"]
build-backend = "hatchling.build"

[project]
name = "industrial-intelligence-platform"
version = "0.1.0"
description = "Industrial data engineering and predictive-maintenance reference platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Maik Huebner" }]
dependencies = [
  "fastapi==0.115.2",
  "neo4j==5.25.0",
  "numpy==1.26.4",
  "pandas==2.1.4",
  "psycopg[binary]==3.2.3",
  "pydantic-settings==2.6.0",
  "pymongo==4.10.1",
  "uvicorn[standard]==0.32.0",
]

[project.optional-dependencies]
spark = ["pyspark==3.5.3"]
airflow = ["apache-airflow==2.10.2"]
test = ["httpx==0.27.2", "pytest==8.3.3", "pytest-cov==5.0.0"]

[project.scripts]
industrial-intelligence = "industrial_intelligence.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/industrial_intelligence"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: requires external containers",
  "spark: requires Java and PySpark",
  "e2e: exercises a complete local pipeline",
  "slow: long-running or high-volume check",
]

[tool.coverage.run]
source = ["industrial_intelligence"]

[tool.ruff]
line-length = 100
target-version = "py311"
